server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;            # после покупки домена здесь будет имя домена (certbot допишет https сам)

    client_max_body_size 120m;    # видео для Happy TV до 100 МБ
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 500;
    gzip_types application/json text/css application/javascript text/javascript image/svg+xml;

    # Фото и видео — прямо с диска, минуя Python. Имя файла уникально, поэтому кэш на год.
    location /media/ {
        alias /var/lib/happytoys/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Всё остальное — приложение
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
