<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Happy Toys — Оптовый каталог игрушек">
  <meta name="theme-color" content="#ffffff">
  <title>Happy Toys — Wholesale</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Auth Modal -->
<div class="overlay" id="authOverlay">
  <div class="auth-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeAuth()">✕</button>
    <div class="auth-tabs">
      <button id="tabLogin"    class="auth-tab active" onclick="switchTab('login')">Войти</button>
      <button id="tabRegister" class="auth-tab"        onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Login -->
    <div id="formLogin">
      <div class="field"><label>Email или логин</label><input id="loginEmail" type="text" placeholder="admin или email@mail.ru"></div>
      <div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="••••••••"></div>
      <button class="btn-primary full" onclick="doLogin()">Войти</button>
    </div>

    <!-- Register -->
    <div id="formRegister" style="display:none">
      <div class="fields-row">
        <div class="field"><label>Имя</label><input id="regFirst" type="text" placeholder="Иван"></div>
        <div class="field"><label>Фамилия</label><input id="regLast" type="text" placeholder="Иванов"></div>
      </div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="email@mail.ru"></div>
      <div class="field"><label>Телефон</label><input id="regPhone" type="tel" placeholder="+7 900 000 00 00"></div>
      <div class="field"><label>Адрес доставки</label><input id="regAddr" type="text" placeholder="Город, улица, дом"></div>
      <div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="минимум 6 символов"></div>
      <button class="btn-primary full" onclick="doRegister()">Зарегистрироваться</button>
    </div>
  </div>
</div>

<!-- Product Modal -->
<div class="overlay" id="productOverlay">
  <div class="modal product-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeProductModal()">✕</button>
    <div id="modalInner"></div>
  </div>
</div>

<!-- Cart Panel -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-head">
    <h2>Корзина <span id="cartHeadCount" class="badge-pill">0</span></h2>
    <button onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-drawer-list" id="cartList">
    <div class="cart-empty">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 16h48l-6 28H14L8 16z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="22" cy="54" r="3" fill="currentColor"/>
        <circle cx="42" cy="54" r="3" fill="currentColor"/>
        <path d="M2 8h8l4 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p>Корзина пуста</p>
    </div>
  </div>
  <div class="cart-drawer-foot" id="cartFoot" style="display:none">
    <textarea id="cartComment" placeholder="Комментарий к заказу..."></textarea>
    <div class="cart-total-row">
      <span>Итого <small id="cartTotalQty"></small></span>
      <strong id="cartTotalVal">₽0.00</strong>
    </div>
    <button class="btn-primary full" onclick="openShareModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Отправить заказ
    </button>
  </div>
</div>
<div class="cart-backdrop" id="cartBackdrop" onclick="toggleCart()"></div>

<!-- Share Modal -->
<div class="overlay" id="shareOverlay">
  <div class="modal share-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeShareModal()">✕</button>
    <h2>Поделиться корзиной</h2>
    <div id="shareSummary"></div>
    <div class="share-link-box">
      <span id="shareUrlSpan">Генерация...</span>
      <button onclick="copyShareLink()">Копировать</button>
    </div>
    <div class="share-btns">
      <button class="btn-wa" onclick="shareWhatsApp()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </button>
    </div>
  </div>
</div>

<!-- App Shell -->
<div id="app">

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-brand">
      <svg class="brand-star" viewBox="0 0 32 32" fill="none">
        <path d="M16 2l3.5 8.5L28 12l-6.5 6 2 9L16 23l-7.5 4 2-9L4 12l8.5-1.5L16 2z" fill="#FF6B35" stroke="#FF6B35" stroke-width="1"/>
      </svg>
      <span>Happy Toys</span>
    </div>

    <div class="topbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="topSearch" type="text" placeholder="Поиск товаров..." oninput="onSearch(this.value)" autocomplete="off">
      <div class="search-drop" id="searchDrop"></div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="authBtn" onclick="openAuth()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="icon-btn cart-btn" onclick="toggleCart()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main id="mainContent"></main>

  <!-- Bottom nav -->
  <nav class="bottom-nav">
    <button id="bn-home" class="bn-btn active" onclick="navigate('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Главная</span>
    </button>
    <button id="bn-catalog" class="bn-btn" onclick="navigate('catalog')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Каталог</span>
    </button>
    <button id="bn-profile" class="bn-btn" onclick="navigate('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Профиль</span>
    </button>
    <button id="bn-admin" class="bn-btn" onclick="navigate('admin')" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Админ</span>
    </button>
  </nav>

</div>

<script src="/static/app.js"></script>
</body>
</html>
