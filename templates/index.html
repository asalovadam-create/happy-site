<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Happy Toys — Оптовый каталог игрушек">
  <meta name="theme-color" content="#ffffff">
  <title>Happy Toys — Wholesale</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Happy Toys">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=1779780019">
</head>
<body>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>

<!-- Auth Modal -->
<div class="overlay" id="authOverlay">
  <div class="auth-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeAuth()">✕</button>

    <!-- Logo inside modal -->
    <div class="auth-logo">
      <svg width="48" height="48" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="46" rx="22" ry="7" fill="#e0ecf8"/>
        <ellipse cx="11" cy="44" rx="9" ry="5.5" fill="#e8f3fb"/>
        <ellipse cx="45" cy="44" rx="9" ry="5.5" fill="#e8f3fb"/>
        <rect x="14" y="26" width="28" height="20" rx="2" fill="#FFB347"/>
        <rect x="22" y="35" width="12" height="11" rx="3" fill="#1e88e5"/>
        <rect x="14" y="20" width="5" height="8" rx="1" fill="#FF8C00"/>
        <rect x="21" y="20" width="4" height="8" rx="1" fill="#FF8C00"/>
        <rect x="31" y="20" width="4" height="8" rx="1" fill="#FF8C00"/>
        <rect x="37" y="20" width="5" height="8" rx="1" fill="#FF8C00"/>
        <rect x="20" y="14" width="16" height="15" rx="2" fill="#FFC34D"/>
        <polygon points="28,1 35,14 21,14" fill="#e53935"/>
        <polygon points="10,12 14,25 6,25" fill="#42A5F5"/>
        <polygon points="46,12 50,25 42,25" fill="#42A5F5"/>
        <rect x="24" y="18" width="8" height="8" rx="2" fill="#1e88e5"/>
        <rect x="7" y="43" width="42" height="3" rx="1.5" fill="#66BB6A" opacity="0.9"/>
      </svg>
      <span class="brand-name-colored auth-brand-name"><span class="bc-1">H</span><span class="bc-2">a</span><span class="bc-3">p</span><span class="bc-4">p</span><span class="bc-5">y</span> <span class="bc-6">T</span><span class="bc-7">o</span><span class="bc-8">y</span><span class="bc-9">s</span></span>
    </div>

    <div class="auth-tabs">
      <button id="tabLogin"    class="auth-tab active" onclick="switchTab('login')">Войти</button>
      <button id="tabRegister" class="auth-tab"        onclick="switchTab('register')">Регистрация</button>
    </div>

    <!-- Login -->
    <div id="formLogin">
      <div class="field"><label>Email или логин</label><input id="loginEmail" type="text" placeholder="admin или email@mail.ru" autocomplete="username"></div>
      <div class="field"><label>Пароль</label><input id="loginPass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-primary full" onclick="doLogin()">Войти</button>
      <div class="auth-hint">Для демо: логин <strong>admin</strong> / пароль <strong>admin123</strong></div>
    </div>

    <!-- Register -->
    <div id="formRegister" style="display:none">
      <div class="fields-row">
        <div class="field"><label>Имя</label><input id="regFirst" type="text" placeholder="Иван" autocomplete="given-name"></div>
        <div class="field"><label>Фамилия</label><input id="regLast" type="text" placeholder="Иванов" autocomplete="family-name"></div>
      </div>
      <div class="field"><label>Email</label><input id="regEmail" type="email" placeholder="email@mail.ru" autocomplete="email"></div>
      <div class="field"><label>Телефон</label><input id="regPhone" type="tel" placeholder="+7 900 000 00 00" autocomplete="tel"></div>
      <div class="field"><label>Адрес доставки</label><input id="regAddr" type="text" placeholder="Город, улица, дом" autocomplete="street-address"></div>
      <div class="field"><label>Пароль</label><input id="regPass" type="password" placeholder="минимум 6 символов" autocomplete="new-password"></div>
      <button class="btn-primary full" onclick="doRegister()">Зарегистрироваться</button>
    </div>
  </div>
</div>

<!-- Product Modal -->
<div class="overlay" id="productOverlay">
  <div class="modal product-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeProductModal()">✕</button>
    <div id="modalInner"></div>
  </div>
</div>

<!-- Cart Panel -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-drawer-head">
    <h2>Корзина <span id="cartHeadCount" class="badge-pill">0</span></h2>
    <button onclick="toggleCart()" aria-label="Закрыть корзину">✕</button>
  </div>
  <div class="cart-drawer-list" id="cartList">
    <div class="cart-empty">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 16h48l-6 28H14L8 16z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="22" cy="54" r="3" fill="currentColor"/>
        <circle cx="42" cy="54" r="3" fill="currentColor"/>
        <path d="M2 8h8l4 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p>Корзина пуста</p>
      <small>Добавьте товары из каталога</small>
    </div>
  </div>
  <div class="cart-drawer-foot" id="cartFoot" style="display:none">
    <textarea id="cartComment" placeholder="Комментарий к заказу (условия доставки, пожелания...)..." rows="2"></textarea>
    <div class="cart-total-row">
      <span>Итого <small id="cartTotalQty"></small></span>
      <strong id="cartTotalVal">₽0.00</strong>
    </div>
    <div class="cart-actions">
      <button class="btn-cart-clear" onclick="clearCartConfirm()" title="Очистить корзину">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
        Очистить
      </button>
      <button class="btn-primary" style="flex:1" onclick="openShareModal()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Отправить заказ
      </button>
    </div>
  </div>
</div>
<div class="cart-backdrop" id="cartBackdrop" onclick="toggleCart()"></div>

<!-- Share Modal -->
<div class="overlay" id="shareOverlay">
  <div class="modal share-modal" onclick="event.stopPropagation()">
    <button class="modal-x" onclick="closeShareModal()">✕</button>
    <h2>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      Отправить заказ
    </h2>
    <div id="shareSummary" class="share-summary"></div>
    <div class="share-link-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>
      <span id="shareUrlSpan">Генерация...</span>
      <button onclick="copyShareLink()">Копировать</button>
    </div>
    <div class="share-btns">
      <button class="btn-wa" onclick="shareWhatsApp()">
        <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
        WhatsApp
      </button>
      <button class="btn-pdf-share" onclick="downloadCartPDF()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" width="18" height="18"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><polyline points="9 15 12 18 15 15"/></svg>
        Скачать PDF
      </button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div class="overlay" id="confirmOverlay">
  <div class="modal confirm-modal" onclick="event.stopPropagation()">
    <div class="confirm-icon">⚠️</div>
    <h3 id="confirmTitle">Вы уверены?</h3>
    <p id="confirmMsg"></p>
    <div class="confirm-btns">
      <button class="btn-confirm-cancel" onclick="closeConfirm()">Отмена</button>
      <button class="btn-confirm-ok" id="confirmOkBtn">Подтвердить</button>
    </div>
  </div>
</div>

<!-- App Shell -->
<div id="app">

  <!-- Header -->
  <header class="topbar">
    <div class="topbar-brand" onclick="navigate('home')" role="button" tabindex="0" title="Happy Toys — Главная">
      <svg class="brand-logo" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <ellipse cx="28" cy="46" rx="22" ry="7" fill="#e0ecf8"/>
        <ellipse cx="11" cy="44" rx="9" ry="5.5" fill="#e8f3fb"/>
        <ellipse cx="45" cy="44" rx="9" ry="5.5" fill="#e8f3fb"/>
        <rect x="14" y="26" width="28" height="20" rx="2" fill="#FFB347"/>
        <rect x="22" y="35" width="12" height="11" rx="3" fill="#1e88e5"/>
        <rect x="14" y="20" width="5" height="8" rx="1" fill="#FF8C00"/>
        <rect x="21" y="20" width="4" height="8" rx="1" fill="#FF8C00"/>
        <rect x="31" y="20" width="4" height="8" rx="1" fill="#FF8C00"/>
        <rect x="37" y="20" width="5" height="8" rx="1" fill="#FF8C00"/>
        <rect x="20" y="14" width="16" height="15" rx="2" fill="#FFC34D"/>
        <polygon points="28,1 35,14 21,14" fill="#e53935"/>
        <polygon points="10,12 14,25 6,25" fill="#42A5F5"/>
        <polygon points="46,12 50,25 42,25" fill="#42A5F5"/>
        <rect x="24" y="18" width="8" height="8" rx="2" fill="#1e88e5"/>
        <rect x="7" y="43" width="42" height="3" rx="1.5" fill="#66BB6A" opacity="0.9"/>
      </svg>
      <div class="brand-text">
        <span class="brand-name-colored"><span class="bc-1">H</span><span class="bc-2">a</span><span class="bc-3">p</span><span class="bc-4">p</span><span class="bc-5">y</span> <span class="bc-6">T</span><span class="bc-7">o</span><span class="bc-8">y</span><span class="bc-9">s</span></span>
        <span class="brand-sub">Оптовый каталог</span>
      </div>
    </div>

    <div class="topbar-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input id="topSearch" type="search" placeholder="Поиск товаров..." oninput="onSearch(this.value)" autocomplete="off" aria-label="Поиск товаров">
      <button class="search-clear" id="searchClearBtn" onclick="clearSearch()" style="display:none" aria-label="Очистить поиск">✕</button>
      <div class="search-drop" id="searchDrop"></div>
    </div>

    <div class="topbar-right">
      <button class="icon-btn" id="authBtn" onclick="openAuth()" aria-label="Аккаунт">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </button>
      <button class="icon-btn cart-btn" onclick="toggleCart()" aria-label="Корзина">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
        <span class="cart-badge" id="cartBadge" style="display:none">0</span>
      </button>
    </div>
  </header>

  <!-- Main content -->
  <main id="mainContent"></main>

  <!-- Bottom nav -->
  <nav class="bottom-nav" role="navigation" aria-label="Основное меню">
    <button id="bn-home" class="bn-btn active" onclick="navigate('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Главная</span>
    </button>
    <button id="bn-catalog" class="bn-btn" onclick="navigate('catalog')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <rect x="3" y="3" width="7" height="7" rx="1"/>
        <rect x="14" y="3" width="7" height="7" rx="1"/>
        <rect x="3" y="14" width="7" height="7" rx="1"/>
        <rect x="14" y="14" width="7" height="7" rx="1"/>
      </svg>
      <span>Каталог</span>
    </button>
    <button id="bn-profile" class="bn-btn" onclick="navigate('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Профиль</span>
    </button>
    <button id="bn-admin" class="bn-btn" onclick="navigate('admin')" style="display:none">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      </svg>
      <span>Админ</span>
    </button>
  </nav>

</div>

<script src="/static/app.js?v=1779780019"></script>
</body>
</html>
